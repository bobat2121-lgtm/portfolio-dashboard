name: sync

# Pull every account into Postgres. Every 30 min through the US trading day (and an hour either side),
# every 4 h around the clock for crypto. About 600 runs a month, well inside a private repo's free
# 2,000 Actions minutes. Times are UTC; GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "7,37 12-22 * * 1-5"
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Ask SnapTrade to re-pull brokers first"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # the first run reads your whole Kraken ledger, which is rate-limited
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
      SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
      KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
      KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
    steps:
      - name: Secrets configured?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Install dependencies
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -q -r requirements-sync.txt

      - name: Sync
        if: steps.cfg.outputs.ok == 'true'
        run: python -m jobs.sync --trigger schedule ${{ inputs.refresh && '--refresh' || '' }}
