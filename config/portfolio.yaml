# Your accounts, and which linked account each one is.
#
# `match` picks the account out of what the source returns. Keys (all optional):
#   institution: text in the broker name          retirement: true/false (IRA, Roth, 401k...)
#   number_last4: last 4 of the account number     name_contains: text in the account name/type
#   id: the provider's account id (strongest pin; `python -m jobs.link` prints it)
# If a rule matches more than one account, the sync warns and asks you to pin it (number_last4 is easiest).
# Accounts a source finds that aren't listed here are still tracked, under a key like fidelity_1234.
#
# This file is committed. Put anything personal (number_last4 / id pins, cost_basis_overrides) in the
# PORTFOLIO_CONFIG secret instead: same shape, merged on top of this file (see portfolio/config.py).
accounts:
  fidelity_taxable:
    label: Fidelity Taxable
    institution: Fidelity
    tax: taxable
    source: snaptrade
    match: {institution: fidelity, retirement: false}

  robinhood_taxable:
    label: Robinhood Taxable
    institution: Robinhood
    tax: taxable
    source: snaptrade
    match: {institution: robinhood, retirement: false, name_contains: individual}

  robinhood_crypto:
    label: Robinhood Crypto
    institution: Robinhood
    tax: taxable
    source: snaptrade
    match: {institution: robinhood, name_contains: crypto}

  robinhood_ira:
    label: Robinhood IRA
    institution: Robinhood
    tax: ira
    source: snaptrade
    match: {institution: robinhood, retirement: true}

  kraken:
    label: Kraken
    institution: Kraken
    tax: taxable
    source: kraken
    match: {}
    # Kraken doesn't report cost basis, so it's worked out from your ledger (average cost). Coins you
    # deposited from another wallet have no known cost: set their total $ basis in the PORTFOLIO_CONFIG
    # secret, e.g. accounts: {kraken: {cost_basis_overrides: {BTC: 25000}}}. Not here: this file is committed.
    cost_basis_overrides: {}

sources:
  snaptrade:
    enabled: true
    min_minutes_between_syncs: 10  # SnapTrade asks for no more than one pull per account per 10 min
    refresh: manual   # never | manual | always: ask SnapTrade to re-pull brokers (manual = Sync button / --refresh)
    overlap_days: 10  # re-read this many days of activity every sync to catch late-posting transactions
    exclude_account_types: [CREDITCARD]  # not holdings (a card balance would read as negative cash)
  kraken:
    enabled: true
    min_minutes_between_syncs: 1
    overlap_days: 3

app:
  # The cloud dashboard holds no broker keys, so its Sync button opens this workflow to run it on GitHub.
  sync_workflow_url: "https://github.com/bobat2121-lgtm/portfolio-dashboard/actions/workflows/sync.yml"

pricing:
  # Held at $1 and grouped as cash (Fidelity core / money-market sweep funds).
  cash_symbols: [SPAXX, FDRXX, FZFXX, SPRXX, FZDXX, SPSXX, CORE, FCASH]
  # Grouped separately from other crypto; priced from Kraken, $1 if Kraken has no USD pair.
  stablecoins: [USDC, USDT, DAI, PYUSD, USDG, USD1, RLUSD, FDUSD, TUSD, USDS, USDE]

# Themes for the Themes, Star map and Briefing views. First match wins: a holding matches by symbol,
# then by asset class. Options follow their underlying (an ASST call counts as a Bitcoin treasury).
# bitcoin_linked themes add up to the "Bitcoin-linked" share.
themes:
  - name: Bitcoin
    color: "#F7931A"
    bitcoin_linked: true
    symbols: [BTC, IBIT, FBTC, GBTC, BTC.MINI, BITB, ARKB, HODL, BRRR, BTCO, EZBC, BTCW]
  - name: Bitcoin treasuries
    color: "#FFE81F"
    bitcoin_linked: true
    symbols: [MSTR, ASST, SMLR, MTPLF, NAKA, MARA, RIOT, CLSK, CEP, XXI, KULR, DJT, BTCS, HUT, CORZ]
  - name: Digital credit
    color: "#4BD5EE"
    bitcoin_linked: true
    symbols: [STRC, STRK, STRF, STRD, STRE, SATA]
  - name: Crypto
    color: "#B388FF"
    symbols: [COIN, HOOD, BMNR, SBET, ETHA, ETHE, BITO, HSDT, GLXY, CRCL]
    asset_classes: [crypto]
  - name: Stocks & funds
    color: "#39FF14"
    asset_classes: [equity, etf, fund, bond, other]
  - name: Cash & stablecoins
    color: "#8A8F98"
    asset_classes: [cash, stablecoin]
